name: Bug Report
description: Something isn't working as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can.
        For **security vulnerabilities**, email security@koshkikode.com instead of opening an issue.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web app
        - Mobile (Android)
        - Mobile (iOS)
        - Desktop (Tauri)
        - API / backend
        - Database / migrations
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS: Ubuntu 24.04 / Windows 11 / macOS 15
        - Browser: Firefox 126 / Chrome 124
        - Node version: 20.x
        - App version / commit: main @ abc1234
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste any console errors, server logs, or attach screenshots.
