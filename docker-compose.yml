# Local development with PostgreSQL
# Usage: docker compose up -d db   (start just the database)
#        npm run dev                (run the app locally against it)
#
# Or run everything in containers:
#        docker compose up --build
#
# Production: set all variables in .env before running docker compose up --build -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: unshelvd
      POSTGRES_USER: unshelvd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unshelvd_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unshelvd"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      args:
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_THRIFTBOOKS_AFF_ID: ${VITE_THRIFTBOOKS_AFF_ID:-}
        VITE_ADSENSE_CLIENT: ${VITE_ADSENSE_CLIENT:-}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://unshelvd:unshelvd_dev@db:5432/unshelvd}
      NODE_ENV: production
      PORT: "8080"
      SESSION_SECRET: ${SESSION_SECRET:-unshelvd-dev-secret-change-me}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
      # Email (SMTP)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # PayPal (optional)
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      # File uploads
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
